<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>AUTO EXPRESS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:18px 16px}h1{margin:0;font-size:25px}.sub{opacity:.8;margin-top:5px}
.wrap{max-width:1100px;margin:auto;padding:14px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}
.tab{border:0;background:#e5e7eb;padding:10px 14px;border-radius:20px;white-space:nowrap}.tab.active{background:#111827;color:white}
.card{background:white;border-radius:15px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0001}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f8fafc;border-radius:12px;padding:13px}.note{font-size:13px;color:#6b7280}.num{font-size:24px;font-weight:700;margin-top:3px}
input,textarea,button{font:inherit}input,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:5px 0}textarea{min-height:80px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.full{grid-column:1/-1}
button{padding:11px 14px;border:0;border-radius:10px}.primary{background:#111827;color:white}.secondary{background:#e5e7eb}
.actions{display:flex;gap:8px;margin-top:8px}.tablewrap{overflow:auto;max-height:58vh}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#f8fafc}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>

</div></div>

let custom = JSON.parse(localStorage.getItem('autoExpressCustomV2') || '{}');
let current = Object.keys(ORIGINAL)[0] || '';

function esc(v){return String(v ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function rows(){return (ORIGINAL[current]||[]).concat(custom[current]||[]);}
function selectSheet(s){
 if(!Object.prototype.hasOwnProperty.call(ORIGINAL,s)) return;
 current=s;
 const search=document.getElementById('search');
 if(search) search.value='';
 render();
}
function renderTabs(){
 const tabs=document.getElementById('tabs');
 tabs.innerHTML=Object.keys(ORIGINAL).map(s=>
  '<button type="button" class="tab '+(s===current?'active':'')+'" data-sheet="'+esc(s)+'">'+esc(s)+'</button>'
 ).join('');
}
function render(){
 renderTabs();
 const data=rows(), q=document.getElementById('search').value.toLowerCase().trim();
 const filtered=q?data.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q))):data;
 document.getElementById('count').textContent=data.length;
 document.getElementById('sheetCount').textContent=Object.keys(ORIGINAL).length;
 document.getElementById('found').textContent=filtered.length;
 const keys=data.length?Object.keys(data[0]):['Name','Contact No.','Vehicle No.','Date','Address','Amount','Package / Services','Notes'];
 document.getElementById('thead').innerHTML='<tr>'+keys.map(k=>'<th>'+esc(k)+'</th>').join('')+'</tr>';
 document.getElementById('tbody').innerHTML=filtered.slice(0,1000).map(r=>'<tr>'+keys.map(k=>'<td>'+esc(r[k])+'</td>').join('')+'</tr>').join('');
}
function addRecord(){
 const r={Name:document.getElementById('name').value,'Contact No.':document.getElementById('contact').value,'Vehicle No.':document.getElementById('vehicle').value,Date:document.getElementById('date').value,Address:document.getElementById('address').value,Amount:document.getElementById('amount').value,'Package / Services':document.getElementById('service').value,Notes:document.getElementById('notes').value};
 if(!r.Name&&!r['Vehicle No.']){alert('Enter name or vehicle number');return;}
 (custom[current] ||= []).push(r); localStorage.setItem('autoExpressCustomV2',JSON.stringify(custom));
 ['name','contact','vehicle','date','address','amount','service','notes'].forEach(id=>document.getElementById(id).value=''); render(); alert('Record added.');
}
function exportCSV(){
 const data=rows(); if(!data.length){alert('No records');return;} const keys=[...new Set(data.flatMap(r=>Object.keys(r)))];
 const csv=[keys,...data.map(r=>keys.map(k=>String(r[k]??'').replaceAll('"','""')))].map(a=>a.map(x=>'"'+x+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=current.replaceAll(' ','_')+'.csv';a.click();
}
document.getElementById('tabs').addEventListener('click',function(e){
 const btn=e.target.closest('button[data-sheet]');

});
